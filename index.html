<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker Kuliah</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>
  <div class="card">
    <h2>Task Tracker Kuliah</h2>

    <!-- Form Tambah Tugas -->
    <form id="task-form">
      <div class="form-group">
        <input type="text" id="judul" placeholder="Judul tugas (min. 3 karakter)" />
      </div>
      <div class="form-row">
        <select id="matkul">
          <option value="Pemrograman Web">Pemrograman Web</option>
          <option value="Basis Data">Basis Data</option>
          <option value="Jaringan Komputer">Jaringan Komputer</option>
          <option value="Sistem Operasi">Sistem Operasi</option>
        </select>
        <input type="date" id="deadline" />
        <button type="submit" id="btn-tambah">Tambah</button>
      </div>
      <div id="error-message" class="error"></div>
    </form>

    <!-- Filter & Counter -->
    <div class="controls">
      <div class="filter-buttons">
        <button class="btn-filter on" data-filter="semua">Semua</button>
        <button class="btn-filter" data-filter="aktif">Aktif</button>
        <button class="btn-filter" data-filter="selesai">Selesai</button>
      </div>
      <span id="counter" class="counter">0 tugas aktif</span>
    </div>

    <!-- Daftar Tugas -->
    <ul id="task-list" class="task-list"></ul>
  </div>
</body>

</html>
